bio_en: <p>I am a Lecturer at Vinh Long University of Technology Education
  (VLUTE), Vietnam, in the Faculty of Mechanical Engineering, and a member of
  the <a href="#research">UAV Technology Research &amp; Training Center</a>. My
  research focuses on <strong>mechatronics</strong>, <strong>embedded systems
  and IoT</strong>, <strong>robotics</strong>, and <strong>motion
  control</strong> — from sensorless servo drives and sliding-mode control to
  field-oriented control of BLDC motors and connected lab platforms for
  students.</p>
bio_vi: '<p>Tôi là giảng viên Khoa Cơ khí, Trường Đại học Công nghệ Kỹ thuật
  Vĩnh Long (VLUTE), đồng thời là thành viên <a href="#research">Trung tâm
  Nghiên cứu và Đào tạo Công nghệ UAV</a>. Hướng nghiên cứu chính: <strong>cơ
  điện tử</strong>, <strong>hệ thống nhúng và IoT</strong>,
  <strong>robot</strong> và <strong>điều khiển chuyển động</strong> — từ ước
  lượng tốc độ không cảm biến cho servo, điều khiển trượt, đến điều khiển FOC
  động cơ BLDC và nền tảng thí nghiệm kết nối cho sinh viên.</p>'
